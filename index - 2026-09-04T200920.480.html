<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Johnny Whiteboard</title>
  <link rel="icon" href="https://github.com/johnny0robot/whiteboard/blob/main/Untitled%20design%20(4).png?raw=true">
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background-color: white; padding: 15px 30px; border-bottom: 2px solid #ddd; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 40px; }
    .app-container { display: flex; flex: 1; height: calc(100vh - 72px); }
    aside { background-color: white; padding: 20px; border-right: 2px solid #ddd; display: flex; flex-direction: column; align-items: flex-start; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); width: 200px; min-width: 200px; }
    main { flex: 1; padding: 15px; background-color: #f1f2f6; display: flex; overflow: auto; }
    .whiteboard { background: white !important; border: 3px solid #333; border-radius: 8px; cursor: crosshair; max-width: 100%; max-height: 100%; }
    header img { height: 40px; margin-right: 15px; }
    header h1 { margin: 0; font-size: 28px; color: #e54c30; }
    button { background-color: blue; color: white; border: none; border-radius: 4px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; }
    button:hover { background-color: darkblue; }
    button:focus { outline: 2px solid blue; }
    header input { margin-left: auto; margin-right: 10px; }
    #number { width: 60px; padding: 5px; font-size: 16px; }
    #name { width: 90%; padding: 6px; font-size: 14px; }
    dialog { border: 3px solid #333; border-radius: 8px; padding: 25px; text-align: center; width: 320px; }
    dialog h3 { margin-top: 0; color: #333; }
    .popup-buttons { display: flex; gap: 15px; margin-top: 20px; }
    .popup-buttons button { flex: 1; }
    .loader { width: 60px; height: 60px; border: 6px solid rgba(229, 76, 48, 0.2); border-top: 6px solid #e54c30; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <img src="https://github.com/johnny0robot/whiteboard/blob/main/Untitled%20design%20(4).png?raw=true" alt="logo">
    <h1>Johnny Whiteboard</h1>
    <input type="color" id="pickColor" value="#000000">
    <input type="number" id="number" value="10" min="1">
  </header>

  <div class="app-container">
    <aside>
      <input type="text" id="name" value="Untitled Whiteboard">
      <button id="p" onclick="drawType('pen')">Pen 🖌️</button>
      <button id="e" onclick="drawType('eraser')">Eraser 🧽</button>
      <p id="savedStatus">All Changes Saved.</p>
    </aside>
    <main><canvas id="paintCanvas" class="whiteboard" width="1000" height="700"></canvas></main>
  </div>

  <dialog id="recoverPopup">
    <h3>Would you like to recover your work?</h3>
    <div class="popup-buttons">
      <button onclick="restore()" style="background-color: #2ed573;">Yes</button>
      <button onclick="document.getElementById('recoverPopup').close()" style="background-color: #ff4757;">No</button>
    </div>
  </dialog>

  <script>
    const [drawBtn, eraserBtn, savedStatusText, canvas, colorPicker, sizePicker] = ['p', 'e', 'savedStatus', 'paintCanvas', 'pickColor', 'number'].map(id => document.getElementById(id));
    const ctx = canvas.getContext('2d');
    let drawing = false, currentMode = "pen";

    ctx.lineCap = 'round';
    const updateBrush = () => { ctx.lineWidth = sizePicker.value; ctx.strokeStyle = currentMode === "pen" ? colorPicker.value : '#ffffff'; };
    ['input', 'change'].forEach(ev => [colorPicker, sizePicker].forEach(el => el.addEventListener(ev, updateBrush)));

    window.addEventListener('load', () => localStorage.getItem('savedDrawings') && document.getElementById('recoverPopup').showModal());

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - rect.left) * (canvas.width / rect.width), y: (t.clientY - rect.top) * (canvas.height / rect.height) };
    };

    const startDraw = (e) => { drawing = true; if(e.cancelable) e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const moveDraw = (e) => {
      if (!drawing) return; if(e.cancelable) e.preventDefault(); const p = getPos(e);
      ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y);
      savedStatusText.innerText = "Saving...";
      localStorage.setItem('savedDrawings', 'true'); localStorage.setItem(document.getElementById("name").value, canvas.toDataURL());
      savedStatusText.innerText = "All Changes Saved.";
    };
    const stopDraw = () => { drawing = false; ctx.beginPath(); };

    ['mousedown', 'touchstart'].forEach(ev => canvas.addEventListener(ev, startDraw));
    ['mousemove', 'touchmove'].forEach(ev => canvas.addEventListener(ev, moveDraw));
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => canvas.addEventListener(ev, stopDraw));

    function restore() {
      document.getElementById('recoverPopup').innerHTML = `<button onclick="document.getElementById('recoverPopup').close()" style="width: auto; float: right; background-color:#747d8c;">X</button><h3 style="margin-top:40px;">Enter whiteboard name</h3><input type="text" id="findName" value="Untitled Whiteboard" style="padding: 8px; width:80%; margin-bottom: 15px;"><button onclick="find()">Find</button>`;
    }

    function find() {
      let name = document.getElementById('findName').value, data = localStorage.getItem(name);
      document.getElementById('recoverPopup').innerHTML = `<div class="loader"></div><p>Loading data...</p>`;
      setTimeout(() => {
        if (data) {
          const img = new Image(); img.src = data;
          img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); document.getElementById('recoverPopup').close(); };
        } else {
          document.getElementById('recoverPopup').innerHTML = `<p>Could not find "${name}".</p><div class="popup-buttons"><button onclick="restore()">Try Again</button><button onclick="document.getElementById('recoverPopup').close()">Close</button></div>`;
        }
      }, 1000);
    }

    function drawType(mode) { currentMode = mode; updateBrush(); drawBtn.style.opacity = mode === 'pen' ? '1' : '0.6'; eraserBtn.style.opacity = mode === 'eraser' ? '1' : '0.6'; }
  </script>
</body>
</html>
